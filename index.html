<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Among the Stars – Friendship Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #05051a;
      --bg-navy: #0a0a2e;
      --nebula-purple: #6b2d8b;
      --nebula-blue: #1e3a8a;
      --nebula-pink: #9b4dca;
      --cyan-glow: #22d3ee;
      --text-white: #f8fafc;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text-white);
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    /* Canvas for stars & particles */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Parallax layer for mouse/touch */
    #parallax-layer {
      position: fixed;
      inset: -50px;
      z-index: 1;
      pointer-events: none;
      transition: transform 0.1s ease-out;
    }

    /* Screens */
    .screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s ease, visibility 1.2s;
      pointer-events: none;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Opening Screen */
    #opening {
      text-align: center;
      padding: 2rem;
    }

    .quote {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 4.5vw, 2.6rem);
      font-weight: 600;
      line-height: 1.4;
      max-width: 720px;
      margin-bottom: 2.5rem;
      text-shadow: 0 0 30px rgba(155, 77, 202, 0.6);
      animation: fadeInUp 1.8s ease 0.3s both;
    }

    .quote span {
      display: block;
      font-size: 0.85em;
      opacity: 0.9;
      margin-top: 0.4rem;
    }

    .btn-start {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1rem 2.2rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-white);
      background: transparent;
      border: 1.5px solid var(--cyan-glow);
      border-radius: 999px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s ease;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.35),
                  inset 0 0 20px rgba(34, 211, 238, 0.1);
      animation: fadeInUp 1.8s ease 0.8s both;
    }

    .btn-start::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.25), rgba(155, 77, 202, 0.25));
      opacity: 0;
      transition: opacity 0.4s;
    }

    .btn-start:hover,
    .btn-start:focus {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 35px rgba(34, 211, 238, 0.6),
                  inset 0 0 25px rgba(34, 211, 238, 0.2);
    }

    .btn-start:hover::before {
      opacity: 1;
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    /* Constellation Screen */
    #constellation {
      padding: 1rem;
    }

    .constellation-title {
      position: absolute;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      opacity: 0.85;
      letter-spacing: 0.05em;
      text-align: center;
      width: 90%;
    }

    .stars-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 900px;
      max-height: 700px;
    }

    .memory-star {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff 0%, #a5f3fc 20%, #22d3ee 45%, transparent 70%);
      box-shadow: 0 0 20px #22d3ee, 0 0 40px rgba(34, 211, 238, 0.5), 0 0 60px rgba(155, 77, 202, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s;
      animation: pulseStar 3s ease-in-out infinite;
      z-index: 5;
    }

    .memory-star:hover,
    .memory-star:focus {
      transform: scale(1.35);
      box-shadow: 0 0 30px #22d3ee, 0 0 60px rgba(34, 211, 238, 0.7), 0 0 90px rgba(155, 77, 202, 0.5);
      z-index: 20;
    }

    .memory-star .label {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 8px;
      font-size: 0.7rem;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s;
      background: rgba(0,0,0,0.55);
      padding: 3px 8px;
      border-radius: 6px;
      pointer-events: none;
    }

    .memory-star:hover .label {
      opacity: 1;
    }

    /* Glass Card Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 5, 26, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s, visibility 0.45s;
      padding: 1.2rem;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .glass-card {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 2rem 1.8rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                  0 0 40px rgba(34, 211, 238, 0.15),
                  inset 0 1px 0 rgba(255,255,255,0.1);
      transform: scale(0.85) translateY(30px);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(20px);
    }

    .modal-overlay.open .glass-card {
      transform: scale(1) translateY(0);
    }

    .glass-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      margin-bottom: 1rem;
      color: #a5f3fc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .glass-card p, .glass-card li {
      font-size: 0.98rem;
      line-height: 1.65;
      opacity: 0.95;
    }

    .glass-card ul {
      list-style: none;
      margin: 1rem 0;
    }

    .glass-card li {
      padding: 0.45rem 0;
      padding-left: 1.4rem;
      position: relative;
    }

    .glass-card li::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: var(--cyan-glow);
      font-size: 0.75rem;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s;
    }

    .close-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    .song-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.2rem;
      padding: 0.7rem 1.4rem;
      background: linear-gradient(135deg, rgba(34,211,238,0.25), rgba(155,77,202,0.3));
      border: 1px solid rgba(34,211,238,0.5);
      border-radius: 999px;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .song-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 0 20px rgba(34,211,238,0.4);
    }

    /* Final Planet */
    #final {
      text-align: center;
    }

    .planet {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%,
        #e0f2fe 0%,
        #67e8f9 15%,
        #0ea5e9 35%,
        #1e40af 60%,
        #0f172a 85%);
      box-shadow:
        0 0 40px rgba(14, 165, 233, 0.6),
        0 0 80px rgba(34, 211, 238, 0.35),
        0 0 120px rgba(155, 77, 202, 0.25),
        inset -20px -20px 40px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: floatPlanet 6s ease-in-out infinite;
      position: relative;
      z-index: 5;
    }

    .planet:hover {
      transform: scale(1.12);
    }

    .planet::after {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(34, 211, 238, 0.3);
      animation: ringPulse 3s ease-out infinite;
    }

    .planet-label {
      margin-top: 1.8rem;
      font-size: 1.05rem;
      opacity: 0.9;
      letter-spacing: 0.03em;
    }

    /* Letter */
    .letter {
      font-family: 'Playfair Display', serif;
      text-align: left;
      line-height: 1.7;
    }

    .letter .greeting {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #a5f3fc;
    }

    .letter .body {
      font-size: 1.05rem;
      margin-bottom: 1.2rem;
    }

    .letter .sign {
      margin-top: 1.5rem;
      font-style: italic;
      opacity: 0.9;
    }

    /* Ending stars */
    #ending {
      text-align: center;
      padding: 2rem;
    }

    .ending-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 4vw, 2.1rem);
      margin-top: 2rem;
      text-shadow: 0 0 25px rgba(155, 77, 202, 0.7);
      animation: fadeInUp 1.5s ease both;
    }

    /* Controls */
    .controls {
      position: fixed;
      bottom: 1.2rem;
      right: 1.2rem;
      z-index: 50;
      display: flex;
      gap: 0.6rem;
    }

    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(10,10,46,0.6);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .ctrl-btn:hover {
      background: rgba(34,211,238,0.25);
      border-color: var(--cyan-glow);
    }

    /* Toast for shooting star messages */
    .toast {
      position: fixed;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(10, 10, 46, 0.85);
      border: 1px solid rgba(34, 211, 238, 0.4);
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      font-size: 0.95rem;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s ease;
      backdrop-filter: blur(12px);
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Hint */
    .hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      opacity: 0.55;
      letter-spacing: 0.04em;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseStar {
      0%, 100% { box-shadow: 0 0 20px #22d3ee, 0 0 40px rgba(34,211,238,0.5); }
      50% { box-shadow: 0 0 30px #22d3ee, 0 0 55px rgba(34,211,238,0.7), 0 0 80px rgba(155,77,202,0.4); }
    }

    @keyframes floatPlanet {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes ringPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .memory-star {
        width: 42px;
        height: 42px;
        font-size: 1.15rem;
      }
      .glass-card {
        padding: 1.6rem 1.3rem;
        border-radius: 18px;
      }
      .planet {
        width: 130px;
        height: 130px;
      }
      .constellation-title {
        top: 1rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div id="parallax-layer"></div>

  <!-- Opening Screen -->
  <section id="opening" class="screen active">
    <p class="quote">
      Among billions of stars,<br>
      <span>I found a friend worth keeping. ✨</span>
    </p>
    <button class="btn-start" id="startBtn" aria-label="Start the Journey">
      🚀 Start the Journey
    </button>
  </section>

  <!-- Constellation Screen -->
  <section id="constellation" class="screen">
    <h1 class="constellation-title">Our Constellation of Memories</h1>
    <div class="stars-container" id="starsContainer">
      <!-- Stars injected by JS -->
    </div>
    <p class="hint">Tap a star to open a memory · Catch shooting stars ✨</p>
  </section>

  <!-- Final Planet Screen -->
  <section id="final" class="screen">
    <div class="planet" id="planet" role="button" tabindex="0" aria-label="Open letter"></div>
    <p class="planet-label">A special message awaits…</p>
  </section>

  <!-- Ending Screen -->
  <section id="ending" class="screen">
    <p class="ending-text">Some friendships are written in the stars. ✨</p>
  </section>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true">
    <div class="glass-card" id="cardContent">
      <button class="close-btn" id="closeModal" aria-label="Close">×</button>
      <!-- Dynamic content -->
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="muteBtn" title="Mute / Unmute music" aria-label="Toggle music">🔊</button>
  </div>

  <!-- Hidden audio (user can replace src with own soft piano / ambient file) -->
  <audio id="bgMusic" loop preload="none">
    <!-- Add your own soft piano or ambient track here -->
    <!-- <source src="your-soft-piano.mp3" type="audio/mpeg"> -->
  </audio>

  <script>
    // ========== CONFIG ==========
    const FRIEND_NAME = "Friend"; // ← Change this to your friend's name

    const MEMORIES = [
      {
        id: "hello",
        emoji: "⭐",
        title: "First Hello",
        label: "First Hello",
        content: `
          <h2>⭐ First Hello</h2>
          <p>"Yahin se sab shuru hua..."</p>
          <p style="margin-top:1rem; opacity:0.9;">
            That first message, that first awkward hello, that moment when the universe quietly decided our paths should cross.
            Looking back, it feels like the stars had already written this chapter.
          </p>
        `
      },
      {
        id: "funny",
        emoji: "😂",
        title: "Funniest Memory",
        label: "Funniest Memory",
        content: `
          <h2>😂 Funniest Memory</h2>
          <p>Remember that one time when everything went hilariously wrong and we couldn’t stop laughing?</p>
          <p style="margin-top:1rem; font-style:italic; opacity:0.85;">
            (Yahan apna favorite funny chat screenshot ya story daal sakte ho – bas is text ko edit kar lo.)
          </p>
          <p style="margin-top:1rem;">Those moments when laughter becomes the language of friendship.</p>
        `
      },
      {
        id: "picture",
        emoji: "📸",
        title: "Best Picture",
        label: "Best Picture",
        content: `
          <h2>📸 Best Picture</h2>
          <p>That one photo that captures us perfectly – the smiles, the chaos, the pure joy.</p>
          <div style="margin:1.2rem 0; text-align:center; opacity:0.7; font-size:0.9rem;">
            [Yahan favorite selfie / photo ka link ya description add kar sakte ho]
          </div>
          <p>Some frames are worth more than a thousand words.</p>
        `
      },
      {
        id: "appreciate",
        emoji: "💬",
        title: "Things I Appreciate",
        label: "Things I Appreciate",
        content: `
          <h2>💬 Things I Appreciate About You</h2>
          <ul>
            <li>You always listen – even when the world feels noisy.</li>
            <li>Your honesty, even when it’s hard.</li>
            <li>The way you make ordinary days feel special.</li>
            <li>Your quiet strength and soft heart.</li>
            <li>How you show up, no matter what.</li>
            <li>The laughter you bring into every conversation.</li>
            <li>That you somehow always know when I need you.</li>
            <li>Your ability to turn chaos into comfort.</li>
          </ul>
          <p style="margin-top:0.8rem; opacity:0.85;">There are a thousand more, but these stars shine the brightest.</p>
        `
      },
      {
        id: "song",
        emoji: "🎵",
        title: "Our Song",
        label: "Our Song",
        content: `
          <h2>🎵 Our Song</h2>
          <p>Every friendship has a soundtrack. This one is ours.</p>
          <button class="song-btn" id="playSongBtn">▶ Play Our Song</button>
          <p style="margin-top:1.2rem; font-size:0.9rem; opacity:0.75;">
            (You can replace the button action with a YouTube link or actual audio file.)
          </p>
        `
      },
      {
        id: "wish",
        emoji: "🌠",
        title: "Wish Star",
        label: "Wish Star",
        content: `
          <h2>🌠 Wish Star</h2>
          <p>On this Friendship Day, I wish…</p>
          <p style="margin-top:1rem;">
            That our bond stays as vast and bright as this galaxy.<br>
            That no matter how far we travel, we always find our way back to each other.<br>
            That laughter, trust, and quiet understanding never leave our side.
          </p>
          <p style="margin-top:1.2rem; color:#a5f3fc;">Happy Friendship Day. 🌌💙</p>
        `
      },
      {
        id: "adventure",
        emoji: "🚀",
        title: "Shared Adventures",
        label: "Adventures",
        content: `
          <h2>🚀 Shared Adventures</h2>
          <p>From late-night talks to random plans that somehow always work out…</p>
          <p style="margin-top:1rem;">
            Every little adventure with you becomes a memory I want to keep forever.
            Thank you for being my co-pilot through the chaos and the calm.
          </p>
        `
      },
      {
        id: "support",
        emoji: "💙",
        title: "Quiet Support",
        label: "Support",
        content: `
          <h2>💙 Quiet Support</h2>
          <p>You don’t always need words. Sometimes just knowing you’re there is enough.</p>
          <p style="margin-top:1rem;">
            In the moments when everything felt heavy, your presence made the load lighter.
            That’s a kind of magic only real friends carry.
          </p>
        `
      }
    ];

    const SHOOTING_MESSAGES = [
      "You're awesome. 💙",
      "Thanks for always being there.",
      "Friends like you are rare.",
      "You make the universe brighter.",
      "Grateful for you, always.",
      "Some people are pure stardust.",
      "Keep shining, friend.",
      "Distance means nothing when friendship is real."
    ];

    // ========== STATE ==========
    let currentScreen = "opening";
    let musicMuted = true;
    let visitedStars = new Set();
    let shootingStars = [];
    let mouseX = 0.5, mouseY = 0.5;

    // ========== CANVAS STARFIELD ==========
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");
    let stars = [];
    let particles = [];
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const count = Math.min(220, Math.floor((w * h) / 3500));
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.6 + 0.3,
          alpha: Math.random() * 0.7 + 0.2,
          twinkle: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.02 + 0.005
        });
      }
      // Nebula particles
      particles = [];
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 80 + 40,
          alpha: Math.random() * 0.06 + 0.02,
          color: Math.random() > 0.5 ? "120, 60, 180" : "30, 80, 180"
        });
      }
    }

    function drawStarfield() {
      ctx.clearRect(0, 0, w, h);

      // Subtle nebula
      particles.forEach(p => {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, `rgba(${p.color}, ${p.alpha})`);
        g.addColorStop(1, "transparent");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Twinkling stars
      stars.forEach(s => {
        s.twinkle += s.speed;
        const a = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
        ctx.fill();
      });

      // Shooting stars
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];
        ss.x += ss.vx;
        ss.y += ss.vy;
        ss.life -= 0.016;

        if (ss.life <= 0 || ss.x > w + 50 || ss.y > h + 50) {
          shootingStars.splice(i, 1);
          continue;
        }

        const gradient = ctx.createLinearGradient(
          ss.x, ss.y,
          ss.x - ss.vx * 12, ss.y - ss.vy * 12
        );
        gradient.addColorStop(0, `rgba(200, 240, 255, ${ss.life})`);
        gradient.addColorStop(1, "transparent");

        ctx.beginPath();
        ctx.moveTo(ss.x, ss.y);
        ctx.lineTo(ss.x - ss.vx * 12, ss.y - ss.vy * 12);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Head
        ctx.beginPath();
        ctx.arc(ss.x, ss.y, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${ss.life})`;
        ctx.fill();
      }

      requestAnimationFrame(drawStarfield);
    }

    function spawnShootingStar() {
      const fromLeft = Math.random() > 0.4;
      shootingStars.push({
        x: fromLeft ? -20 : Math.random() * w * 0.6,
        y: Math.random() * h * 0.4,
        vx: Math.random() * 6 + 5,
        vy: Math.random() * 3 + 2,
        life: 1
      });
    }

    // Click on shooting star area (approx)
    canvas.style.pointerEvents = "none";

    // ========== PARALLAX ==========
    const parallax = document.getElementById("parallax-layer");
    function updateParallax(e) {
      const x = (e.clientX || (e.touches && e.touches[0].clientX) || w / 2) / w;
      const y = (e.clientY || (e.touches && e.touches[0].clientY) || h / 2) / h;
      mouseX = x;
      mouseY = y;
      const moveX = (x - 0.5) * 28;
      const moveY = (y - 0.5) * 22;
      parallax.style.transform = `translate(${moveX}px, ${moveY}px)`;
    }

    window.addEventListener("mousemove", updateParallax);
    window.addEventListener("touchmove", updateParallax, { passive: true });

    // ========== SCREENS ==========
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      currentScreen = id;
    }

    // ========== OPENING → CONSTELLATION ==========
    document.getElementById("startBtn").addEventListener("click", () => {
      // Simple "zoom" feel
      document.getElementById("opening").style.transition = "opacity 1.4s ease, transform 1.4s ease";
      document.getElementById("opening").style.transform = "scale(1.15)";
      setTimeout(() => {
        showScreen("constellation");
        placeStars();
        // Start occasional shooting stars
        setInterval(spawnShootingStar, 12000 + Math.random() * 4000);
        // Try play music (will work after user gesture)
        tryPlayMusic();
      }, 900);
    });

    // ========== PLACE MEMORY STARS ==========
    function placeStars() {
      const container = document.getElementById("starsContainer");
      container.innerHTML = "";
      const positions = [
        { top: "18%", left: "22%" },
        { top: "28%", left: "68%" },
        { top: "42%", left: "15%" },
        { top: "48%", left: "48%" },
        { top: "55%", left: "78%" },
        { top: "68%", left: "30%" },
        { top: "72%", left: "62%" },
        { top: "35%", left: "38%" }
      ];

      MEMORIES.forEach((m, i) => {
        const star = document.createElement("div");
        star.className = "memory-star";
        star.style.top = positions[i].top;
        star.style.left = positions[i].left;
        star.innerHTML = `${m.emoji}<span class="label">${m.label}</span>`;
        star.setAttribute("role", "button");
        star.setAttribute("tabindex", "0");
        star.setAttribute("aria-label", m.title);
        star.addEventListener("click", () => openMemory(m));
        star.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") openMemory(m);
        });
        container.appendChild(star);
      });
    }

    // ========== MODAL ==========
    const modal = document.getElementById("modal");
    const cardContent = document.getElementById("cardContent");

    function openMemory(mem) {
      visitedStars.add(mem.id);
      cardContent.innerHTML = `
        <button class="close-btn" id="closeModal" aria-label="Close">×</button>
        ${mem.content}
      `;
      document.getElementById("closeModal").addEventListener("click", closeModal);
      modal.classList.add("open");

      // Song button special case
      const playBtn = document.getElementById("playSongBtn");
      if (playBtn) {
        playBtn.addEventListener("click", () => {
          // Replace with actual song link if desired
          alert("Yahan apna favorite song ka YouTube / Spotify link open karwa sakte ho 🎵");
          // window.open("https://youtube.com/...", "_blank");
        });
      }

      // After visiting most stars, gently guide to final
      if (visitedStars.size >= 5) {
        setTimeout(() => {
          if (currentScreen === "constellation") {
            // Soft hint could be added, but for now auto after letter later
          }
        }, 800);
      }
    }

    function closeModal() {
      modal.classList.remove("open");
      // If enough stars visited, offer final planet after a short delay
      if (visitedStars.size >= 4 && currentScreen === "constellation") {
        setTimeout(() => {
          // Create a floating "Continue" feeling by showing final after more interaction
        }, 600);
      }
    }

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    // ========== FINAL PLANET ==========
    // Add a way to reach final planet – after visiting stars or a button
    // We'll add a subtle "Journey onward" after 4 stars or via long press / time

    let finalUnlocked = false;
    function checkUnlockFinal() {
      if (visitedStars.size >= 4 && !finalUnlocked) {
        finalUnlocked = true;
        // Add a glowing arrow or just auto-transition after next close
        setTimeout(() => {
          if (currentScreen === "constellation") {
            // Create a temporary continue button
            const cont = document.createElement("button");
            cont.className = "btn-start";
            cont.style.position = "absolute";
            cont.style.bottom = "5rem";
            cont.style.left = "50%";
            cont.style.transform = "translateX(-50%)";
            cont.style.zIndex = "15";
            cont.style.fontSize = "0.95rem";
            cont.style.padding = "0.75rem 1.6rem";
            cont.innerHTML = "🌌 Continue to the Planet";
            cont.addEventListener("click", () => {
              cont.remove();
              showScreen("final");
            });
            document.getElementById("constellation").appendChild(cont);
          }
        }, 1200);
      }
    }

    // Hook into openMemory
    const originalOpen = openMemory;
    openMemory = function(mem) {
      originalOpen(mem);
      checkUnlockFinal();
    };

    document.getElementById("planet").addEventListener("click", openLetter);
    document.getElementById("planet").addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") openLetter();
    });

    function openLetter() {
      cardContent.innerHTML = `
        <button class="close-btn" id="closeModal" aria-label="Close">×</button>
        <div class="letter">
          <p class="greeting">Dear ${FRIEND_NAME},</p>
          <p class="body">
            Life is full of people, but very few become stars that brighten it.
            Thank you for being one of those stars.
          </p>
          <p class="body">
            No matter where life takes us, I hope our friendship always shines just like this galaxy.
          </p>
          <p class="body" style="color:#a5f3fc;">
            Happy Friendship Day! 🌌💙
          </p>
          <p class="sign">With all the light in the universe,<br>Your friend</p>
        </div>
      `;
      document.getElementById("closeModal").addEventListener("click", () => {
        closeModal();
        // After closing letter → ending
        setTimeout(() => {
          showScreen("ending");
          // Burst of extra stars
          for (let i = 0; i < 30; i++) {
            setTimeout(() => spawnShootingStar(), i * 80);
          }
        }, 500);
      });
      modal.classList.add("open");
    }

    // ========== SHOOTING STAR TAP ==========
    // Detect taps near recent shooting stars
    document.addEventListener("click", (e) => {
      if (currentScreen !== "constellation") return;
      // Approximate: if click is not on a memory-star, chance of catching
      if (e.target.closest(".memory-star") || e.target.closest(".btn-start") || e.target.closest(".ctrl-btn")) return;

      // Simple: every few taps give a message (or check proximity)
      if (Math.random() > 0.65 && shootingStars.length > 0) {
        showToast(SHOOTING_MESSAGES[Math.floor(Math.random() * SHOOTING_MESSAGES.length)]);
      }
    });

    // Also allow direct "catch" feel
    let lastToast = 0;
    function showToast(msg) {
      const now = Date.now();
      if (now - lastToast < 2500) return;
      lastToast = now;
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2800);
    }

    // ========== MUSIC ==========
    const audio = document.getElementById("bgMusic");
    const muteBtn = document.getElementById("muteBtn");

    function tryPlayMusic() {
      if (!musicMuted && audio.src) {
        audio.play().catch(() => {});
      }
    }

    muteBtn.addEventListener("click", () => {
      musicMuted = !musicMuted;
      muteBtn.textContent = musicMuted ? "🔇" : "🔊";
      if (musicMuted) {
        audio.pause();
      } else {
        // User must add a source for this to work
        if (!audio.src) {
          // Optional: you can set a free ambient URL if available
          // audio.src = "https://...";
          showToast("Add a soft piano track in the HTML to enable music 🎵");
        } else {
          audio.play().catch(() => showToast("Tap again to allow audio"));
        }
      }
    });

    // ========== INIT ==========
    window.addEventListener("resize", resize);
    resize();
    drawStarfield();

    // First shooting star after a while
    setTimeout(spawnShootingStar, 4000);
  </script>
</body>
</html>
